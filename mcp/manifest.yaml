# yaml-language-server: $schema=./manifest.schema.json
# Canonical MCP manifest for user-level shared servers.
# Project-scoped MCPs should live in the repo that owns the project.
# Keep secrets out of git. Reference environment variable names only.
#
# Sync with:
#   node scripts/mcp-sync.mjs plan
#   node scripts/mcp-sync.mjs apply
#
# Notes:
# - `namespace` prefixes managed server names so sync only touches entries it owns.
# - Use `{ fromEnv: SOME_VAR }` inside `args` to inject a secret or token without checking it into git.
# - Servers are enabled for all agents by default.
# - Use `excludeAgents` only when a server should not be synced to specific clients.

schemaVersion: 1
namespace: dotfiles
defaultScope:
  codex: user
  claude: user
  gemini: user
servers:
  figma:
    name: figma
    transport: http
    url: https://mcp.figma.com/mcp
  sonarqube:
    name: sonarqube
    # Runs as a long-lived HTTP server (shared across all AI clients) instead of
    # a per-session stdio container. Launch/refresh it with:
    #   scripts/sonarqube-mcp.sh   (install.sh runs this automatically)
    # The server authenticates to SONARQUBE_URL using SONARQUBE_TOKEN; clients
    # present the same token as a bearer header (baked in at sync time).
    transport: http
    url: http://localhost:8765/mcp
    auth:
      type: bearer
      fromEnv: SONARQUBE_TOKEN
  posthog:
    name: posthog
    transport: http
    url: https://mcp.posthog.com/mcp
  vercel:
    name: vercel
    transport: http
    url: https://mcp.vercel.com
  codex-cli:
    name: codex-cli
    transport: stdio
    command: codex
    args:
      - mcp-server
    excludeAgents:
      - codex
      - gemini
  next-devtools:
    name: next-devtools
    transport: stdio
    command: npx
    args:
      - -y
      - next-devtools-mcp@latest
  braintrust:
    name: braintrust
    transport: http
    url: https://api.braintrust.dev/mcp
    auth:
      type: bearer
      fromEnv: BRAINTRUST_API_KEY
  langfuse:
    name: langfuse
    transport: http
    url: https://us.cloud.langfuse.com/api/public/mcp
    # Basic auth: store the full header value ("Basic <base64 of pk:sk>") in the
    # env var. Codex reads it at runtime via env_http_headers; claude/gemini bake
    # the resolved header in at sync time.
    auth:
      type: header
      header: Authorization
      fromEnv: LANGFUSE_MCP_AUTH
  neon:
    name: neon
    transport: http
    url: https://mcp.neon.tech/mcp
  anya:
    name: anya
    transport: http
    url: https://internal-mcp.wego.com/mcp/anya
  sonar:
    name: sonar
    transport: http
    url: https://internal-mcp.wego.com/mcp/sonarqube
  sentry:
    name: sentry
    transport: http
    url: https://mcp.sentry.dev/mcp
