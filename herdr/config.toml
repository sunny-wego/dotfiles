onboarding = false

[theme]
name = "tokyo-night-day"

[ui.toast]
# "terminal" routes toasts through the host terminal (Ghostty) as native
# macOS notifications, so agent-blocked alerts show when Ghostty is unfocused.
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_scope = "current"
[experimental]
pane_history = true
