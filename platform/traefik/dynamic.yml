# Traefik file provider — the one middleware every browser-facing router uses.
# Referenced from container labels as `forwardauth@file`.
#
# `forward-auth` is a network alias satisfied by whichever auth service the
# active compose profile started (authstub in dev, oauth2-proxy in google), so
# this address is stable across auth modes.
http:
  middlewares:
    forwardauth:
      forwardAuth:
        address: "http://forward-auth:4180/oauth2/auth"
        trustForwardHeader: true
        # Identity headers the auth layer sets and we forward to the app.
        authResponseHeaders:
          - X-Auth-Request-Email
          - X-Auth-Request-User
          - X-Auth-Request-Preferred-Username

    # v1 whole-app allow-list: a second forward-auth hop to the kiosk, which
    # decides whether this identity may open THIS app. Fail-closed. The kiosk
    # keys the decision off X-App-Slug (set authoritatively per tenant router),
    # NOT X-Forwarded-Host, so trustForwardHeader stays false (default): Traefik
    # must not pass client-supplied X-Forwarded-* into the auth decision.
    appauthz:
      forwardAuth:
        address: "http://kiosk:8000/internal/authz"

    # Strip client-supplied identity + routing headers at ingress so nothing
    # downstream can be spoofed (defense against header spoofing — README §9).
    # X-App-Slug is cleared here and then Set authoritatively per tenant router.
    strip-auth-in:
      headers:
        customRequestHeaders:
          X-Auth-Request-Email: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Preferred-Username: ""
          X-App-Slug: ""
          X-Forwarded-Host: ""
