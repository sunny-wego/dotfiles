# Traefik file provider — the one middleware every browser-facing router uses.
# Referenced from container labels as `forwardauth@file`.
#
# `forward-auth` is a network alias satisfied by whichever auth service the
# active compose profile started (authstub in dev, oauth2-proxy in google), so
# this address is stable across auth modes.
http:
  middlewares:
    forwardauth:
      forwardAuth:
        address: "http://forward-auth:4180/oauth2/auth"
        trustForwardHeader: true
        # Identity headers the auth layer sets and we forward to the app.
        authResponseHeaders:
          - X-Auth-Request-Email
          - X-Auth-Request-User
          - X-Auth-Request-Preferred-Username

    # Strip client-supplied identity headers at ingress so an app can trust
    # them (defense against header spoofing — README §9).
    strip-auth-in:
      headers:
        customRequestHeaders:
          X-Auth-Request-Email: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Preferred-Username: ""
