# =============================================================================
#  Self-serve internal app platform — single-box stack
#
#  `docker compose up` brings up the PLATFORM (control plane + shared services).
#  Tenant apps are NOT defined here — the control-plane launches them
#  dynamically as sibling containers with Traefik + Authelia labels.
#
#  Runs identically on a laptop and on an internal EC2 box; only `.env` differs.
#  See .env.example for the knobs.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Public-ish edge: Traefik + anything it routes to (control-plane UI, tenant apps).
  web:
    name: web
  # Backplane: internal services that tenant apps should reach only in a
  # controlled way (litellm, sqld). Postgres/redis/minio live here too.
  # NOTE: tighter per-tenant network segmentation (so tenant A can't reach
  # tenant B or the datastores directly) is a hardening follow-up — see README.
  backplane:
    name: backplane

volumes:
  postgres_data:
  redis_data:
  sqld_data:
  minio_data:
  traefik_certs:

services:
  # ---------------------------------------------------------------------------
  # traefik — ingress. Routes by hostname, terminates TLS, applies the auth gate.
  # Auto-discovers tenant containers from their Docker labels (no restart).
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false   # only labelled containers are routed
      - --providers.docker.network=web
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # TLS: internal CA or Let's Encrypt DNS-01 in prod. Self-signed locally.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: Traefik only reads labels
      - traefik_certs:/certs
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # authelia — login + end-user RBAC, enforced OUTSIDE the tenant app.
  # Traefik calls it as forward-auth on every request; it allow/denies by
  # role→path rules and injects trusted identity headers.
  # ---------------------------------------------------------------------------
  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: postgres:5432
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
    networks: [web, backplane]
    depends_on: [postgres]
    labels:
      - traefik.enable=true
      - traefik.http.routers.authelia.rule=Host(`auth.${BASE_DOMAIN}`)
      - traefik.http.routers.authelia.entrypoints=websecure
      - traefik.http.services.authelia.loadbalancer.server.port=9091
      # The reusable forward-auth middleware every tenant app references:
      - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/verify?rd=https://auth.${BASE_DOMAIN}
      - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # control-plane — the kiosk. Upload ZIP → LLM→Dockerfile → build → launch
  # tenant container → provision DB namespace + LLM virtual key → lifecycle.
  # ---------------------------------------------------------------------------
  control-plane:
    build: ./control-plane
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      # Talks to Docker only through the socket-proxy, never the raw socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SQLD_ADMIN_URL: http://sqld:8080
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # LLM gateway (see provisionLlmApp.ts). Master key mints tenant virtual keys.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # The kiosk's OWN model access (Dockerfile generation) — its own virtual key.
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${CONTROL_PLANE_LLM_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
    networks: [web, backplane]
    depends_on: [postgres, sqld, minio, litellm, docker-socket-proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kiosk.rule=Host(`kiosk.${BASE_DOMAIN}`)
      - traefik.http.routers.kiosk.entrypoints=websecure
      - traefik.http.routers.kiosk.middlewares=authelia@docker   # kiosk itself is behind auth
      - traefik.http.services.kiosk.loadbalancer.server.port=3000
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # docker-socket-proxy — fences the Docker API. The control-plane can build
  # and run containers, but NOT do arbitrary host-owning operations.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1        # list/create/inspect containers
      IMAGES: 1
      BUILD: 1
      POST: 1              # allow create/start
      NETWORKS: 1
      # everything else stays 0 (no swarm, no secrets, no host config abuse)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backplane]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # litellm — the LLM gateway. Holds the ONE OpenRouter master key; issues
  # per-tenant virtual keys with budgets, rate limits, model allowlists;
  # logs spend per tenant; tenant-scoped response cache (see hooks/tenant_cache.py).
  # ALL LLM traffic — kiosk and every tenant app — flows through here.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/hooks:/app/hooks:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}          # mints/validates virtual keys
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}          # upstream — never leaves this box
      # Virtual keys + budgets + spend ledger persist here (reuses platform Postgres):
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks: [backplane]   # NOT exposed via Traefik — internal only
    depends_on: [postgres, redis]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # sqld — libSQL server (self-hosted Turso). One DB namespace per tenant.
  # ---------------------------------------------------------------------------
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_ENABLE_NAMESPACES: "true"     # per-tenant databases
    volumes:
      - sqld_data:/var/lib/sqld
    networks: [backplane]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # postgres — the platform's own memory: tenant↔app↔db map, build history,
  # role config, Authelia store, LiteLLM key/budget ledger (separate databases).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # creates `litellm` + `authelia` DBs
    networks: [backplane]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # redis — LiteLLM response cache (tenant-scoped) + rate-limit counters.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backplane]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # minio — S3-compatible storage: uploaded ZIPs, generated Dockerfiles,
  # DB backups, and per-tenant app blob buckets.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backplane]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ofelia — Docker-native cron. Runs tenant scheduled jobs as containers.
  # Optional: drop it if no app needs scheduled work.
  # ---------------------------------------------------------------------------
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # reads job labels off containers
    networks: [backplane]
    logging: *default-logging
