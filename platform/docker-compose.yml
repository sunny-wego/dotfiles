# =============================================================================
#  Platform services — the pieces WE run on top of Coolify.
#
#  Architecture: Coolify is the ENGINE (installed separately via its own
#  installer). It owns ingress/TLS/domains, build, container lifecycle, cron
#  (Scheduled Tasks), env/secret storage, resource limits, rollback, and
#  multi-server placement. We do NOT hand-roll Traefik / Ofelia / a
#  docker-socket-proxy anymore — Coolify provides all of that.
#
#  This compose defines only the platform SERVICES (litellm, authelia, sqld,
#  the kiosk, and their datastores). Deploy it as a Coolify "Docker Compose"
#  resource, or run it standalone for local dev. Tenant apps are NOT here —
#  the kiosk creates them via the Coolify API (build image -> push -> deploy
#  from image, one Destination per tenant).
#
#  See docs/coolify-evaluation.md for the full architecture + operating rules.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  postgres_data:
  redis_data:
  sqld_data:

services:
  # ---------------------------------------------------------------------------
  # kiosk — our product. ZIP-drop UI, detection + LLM-generated probe scripts,
  # LLM Dockerfile generation + build-verify-heal, RBAC manifest. Drives Coolify
  # via its API (create app from image, env, domain, limits, scheduled task,
  # custom Traefik labels for the Authelia middleware, deploy).
  # Deployed as a standard Dockerfile app in Coolify so its own custom labels
  # (Authelia gate on the kiosk) are honored.
  # ---------------------------------------------------------------------------
  kiosk:
    build: ./control-plane
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      # Coolify engine API — the kiosk orchestrates everything through this.
      COOLIFY_BASE_URL: ${COOLIFY_BASE_URL}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN}
      # Registry we build tenant images into; Coolify deploys FROM these images.
      REGISTRY_URL: ${REGISTRY_URL}
      REGISTRY_USER: ${REGISTRY_USER}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
      # Per-tenant DB provisioning (libSQL namespaces — the cheap default).
      SQLD_ADMIN_URL: http://sqld:8080
      # LLM gateway — mints per-tenant virtual keys.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${CONTROL_PLANE_LLM_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN}
    depends_on: [postgres, sqld, litellm]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # litellm — LLM gateway. Holds the ONE OpenRouter master key; per-tenant
  # virtual keys with budgets/limits; tenant-scoped Redis cache.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/hooks:/app/hooks:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on: [postgres, redis]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # authelia — end-user auth + RBAC. Attached to tenant apps as a Traefik
  # forward-auth middleware via each app's custom Container Labels (Coolify
  # honors custom labels on standard Dockerfile/image apps — NOT on compose,
  # which is why tenant apps deploy as images, not compose).
  # ---------------------------------------------------------------------------
  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    volumes:
      - ./authelia:/config
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: postgres:5432
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
    depends_on: [postgres]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # sqld — libSQL server. One namespace per tenant = the cheap per-tenant DB
  # (~50-100x lighter than a Postgres instance per tenant). SQLite-on-volume is
  # the alternative for tiny single-container apps.
  # ---------------------------------------------------------------------------
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_ENABLE_NAMESPACES: "true"
    volumes:
      - sqld_data:/var/lib/sqld
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # postgres — platform metadata (tenant↔app↔db map, manifests, roles) +
  # litellm + authelia sidecar databases. Secrets for tenant apps live in
  # Coolify's own encrypted env store, not here.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # redis — LiteLLM tenant-scoped cache + rate-limit counters.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    logging: *default-logging
