# Egress proxy for tenant apps — default-deny with an allowlist the kiosk
# regenerates at /egress/allowlist.txt (union of every app's outbound allowlist).
#
# Structural default-deny is the internal tenant network (apps have no route to
# the internet at all); this proxy is the ONLY path out, and it denies anything
# not on the allowlist. squid re-reads the allowlist on `squid -k reconfigure`,
# which the kiosk triggers whenever an app's allowlist changes.

http_port 3128

# Allowlisted destinations (one domain per line; a leading dot matches subdomains).
acl allowed_domains dstdomain "/egress/allowlist.txt"

# Tenants reach the proxy from the internal docker network only.
acl tenant_src src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl SSL_ports port 443
acl CONNECT method CONNECT

# Deny CONNECT to non-443 and anything not allowlisted.
http_access deny CONNECT !SSL_ports
http_access allow tenant_src allowed_domains
http_access deny all

# No caching — this is a policy gate, not a cache. (Logs go to squid's default
# /var/log/squid/access.log inside the container; `docker exec egress-proxy
# tail -f /var/log/squid/access.log` to watch decisions.)
cache deny all
shutdown_lifetime 1 second
