name: platform-tests

# Fast, no-infrastructure unit tests for the internal app platform's kiosk.
# Behaviour/contract tests only (base-image guard, upload safety, redaction,
# detection, app access, secret storage) — the with-Docker end-to-end checks
# live in platform/scripts/smoke-test.sh and run against a live stack.
on:
  push:
    paths: ['platform/**']
  pull_request:
    paths: ['platform/**']

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r kiosk/requirements.txt -r kiosk/requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest kiosk/tests -q
